name: CI

on:
  push:
    branches: [main]
  pull_request:

# 远端 CI 只跑不依赖浏览器与 GPU 的静态检查与单元测试。
# Playwright 端到端测试（含 WebGPU 渲染验证和视觉快照）只在本地运行：
# 无头 Linux 环境无法稳定渲染 WebGPU 画布（详见 设计/WebGPU测试说明.md），
# 因此强制要求 push 前在本地执行 npm run ci 跑完全套检查（见 AGENTS.md）。
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Build and type check
        run: npm run build

      - name: Run unit tests
        run: npm test
